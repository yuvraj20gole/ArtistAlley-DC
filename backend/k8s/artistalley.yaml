apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artwork-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artwork-service
  template:
    metadata:
      labels:
        app: artwork-service
    spec:
      containers:
        - name: artwork-service
          image: artistalley-backend:latest
          imagePullPolicy: Never
          command: ["python", "server.py"]
          ports:
            - containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: artwork-service
spec:
  selector:
    app: artwork-service
  ports:
    - port: 50051
      targetPort: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media
spec:
  replicas: 3
  selector:
    matchLabels:
      app: media
  template:
    metadata:
      labels:
        app: media
    spec:
      containers:
        - name: media
          image: artistalley-backend:latest
          imagePullPolicy: Never
          command: ["python", "media_server.py", "60201"]
          ports:
            - containerPort: 60201
---
apiVersion: v1
kind: Service
metadata:
  name: media
spec:
  clusterIP: None
  selector:
    app: media
  ports:
    - port: 60201
      targetPort: 60201
---
apiVersion: apps/v1
