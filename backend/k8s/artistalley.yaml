          imagePullPolicy: Never
          command: ["python", "lock_manager.py", "detect"]
          ports:
            - containerPort: 60100
---
apiVersion: v1
kind: Service
metadata:
  name: lock-manager
spec:
  selector:
    app: lock-manager
  ports:
    - port: 60100
      targetPort: 60100
