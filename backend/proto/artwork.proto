syntax = "proto3";

package artistalley;

// Service exposed by the Artwork microservice.
// Every RPC now carries a Lamport logical timestamp so both
// services can maintain a consistent event ordering without
// relying on synchronized wall-clock time.
service ArtworkService {
  rpc GetArtwork (ArtworkRequest) returns (ArtworkResponse);
  rpc ListArtworksByCategory (CategoryRequest) returns (stream ArtworkResponse);
}

message ArtworkRequest {
  int32 artwork_id = 1;
  int32 lamport_timestamp = 2;
}

message CategoryRequest {
  string category = 1;
  int32 lamport_timestamp = 2;
}

message ArtworkResponse {
  int32 artwork_id = 1;
  string title = 2;
  string artist = 3;
  string category = 4;
  double price = 5;
  int32 views = 6;
  int32 likes = 7;
  string status = 8;
  int32 lamport_timestamp = 9;
}

// --- Experiment 4: Peer-to-peer mutual exclusion (Ricart-Agrawala) ---
// Every Artist node runs this server AND calls it on its peers.
service MutexService {
  rpc RequestAccess (AccessRequest) returns (AccessReply);
}

message AccessRequest {
  int32 node_id = 1;
  int32 timestamp = 2;
}

message AccessReply {
  int32 node_id = 1;
  int32 timestamp = 2;
}

// --- Experiment 5: Deadlock simulation & resolution ---
service LockService {
  rpc AcquireLock (LockRequest) returns (LockReply);
  rpc ReleaseLock (LockRequest) returns (LockReply);
}

message LockRequest {
  string resource_id = 1;
  int32 holder_id = 2;
  int32 timestamp = 3;
}

message LockReply {
  bool granted = 1;
  string message = 2;
}

// --- Experiment 6: Least Connections load balancing ---
// Media Service replicas handle artwork image uploads/processing
// (resize, thumbnail generation, metadata extraction) - genuinely
// variable-latency work depending on file size/resolution. The
// LoadBalancer sits in front of N identical MediaService backends
// and routes each incoming upload to whichever backend currently
// has the fewest active (in-flight) connections.
service MediaService {
  rpc ProcessImage (ImageRequest) returns (ImageReply);
}

message ImageRequest {
  int32 image_id = 1;
  int32 lamport_timestamp = 2;
}

message ImageReply {
  int32 image_id = 1;
  string processed_by = 2;
  string status = 3;
  int32 lamport_timestamp = 4;
}

// --- Experiment 7: Eventual Consistency for auto-save sync ---
// Draft replicas accept auto-save writes locally and immediately
// (availability first), then asynchronously gossip the update to
// peer replicas. Conflicts are resolved with Last-Write-Wins using
// the Lamport timestamp - reusing the same clock discipline as
// Experiment 3. All replicas eventually converge to the same state.
service DraftService {
  rpc SaveDraft (DraftUpdate) returns (SaveAck);
  rpc SyncUpdate (DraftUpdate) returns (SaveAck);
  rpc GetDraft (DraftQuery) returns (DraftState);
}

message DraftUpdate {
  string draft_id = 1;
  string content = 2;
  int32 lamport_timestamp = 3;
  string origin_replica = 4;
}

message SaveAck {
  bool accepted = 1;
  string replica = 2;
  int32 lamport_timestamp = 3;
}

message DraftQuery {
  string draft_id = 1;
}

message DraftState {
  string draft_id = 1;
  string content = 2;
  int32 lamport_timestamp = 3;
  string origin_replica = 4;
}
